plugins {
    id 'com.android.application'
}

// ── Auto-incrementing build number ──────────────────────────────────────────
def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def buildNumber = (versionProps['VERSION_CODE'] ?: '1').toInteger()

// Increment and save only when actually assembling an APK
gradle.taskGraph.whenReady { graph ->
    def buildTasks = [':app:assembleDebug', ':app:assembleRelease',
                      'assembleDebug', 'assembleRelease']
    if (buildTasks.any { graph.hasTask(it) }) {
        buildNumber++
        versionProps['VERSION_CODE'] = buildNumber.toString()
        versionPropsFile.withOutputStream { versionProps.store(it, null) }
        println ">> Build number incremented to: ${buildNumber}"
    }
}
// ────────────────────────────────────────────────────────────────────────────

android {
    namespace 'com.example.printerdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.printerdemo"
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0." + buildNumber
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['cloudpos.jar', 'core-3.3.0.jar'])
}
